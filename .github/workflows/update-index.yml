name: Update index

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.md'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate index.md
        run: make update_index

      - name: Commit changes
        run: |
          if git diff --quiet -- index.md; then
            echo "index.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md
          git commit -m "chore: update index.md"
          git push
